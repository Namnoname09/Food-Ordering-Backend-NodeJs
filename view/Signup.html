<!doctype html>
<html lang="en">
  <head>
    <title>Account Signup</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <main class="container">
      <div class="brand">
        <div class="logo">Logo</div>
        <img
          class="brand-image"
          src="./Asset/603f2713cb871d114710f8bae5edb87d4af3c4f7.gif"
          alt=""
          aria-hidden="true"
        />
      </div>

      <div class="form-section">
        <form class="login-form" action="/auth/register" method="post">
          <p id="signup-message" role="status"></p>
          <h1 class="account-signup">Account Signup</h1>
          <p class="subtitle">
            Become a member and enjoy exclusive promotions.
          </p>

          <div class="field">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name" maxlength="255" required />
          </div>
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">Choose your gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="dateOfBirth">Date of Birth</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
          </div>

          <button type="submit" class="btn-primary">Continue</button>
        </form>
      </div>
    </main>

    <script src="./js/auth.js" defer></script>
  </body>
</html>
