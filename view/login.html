<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <main class="container">
      <div class="brand">
        <div class="logo">Logo</div>
        <img
          class="brand-image"
          src="./Asset/8da4f1d7ff459ac79a3bbd831ac3e846f325d9e7.gif"
          alt=""
          aria-hidden="true"
        />
      </div>

      <div class="form-section">
        <form class="login-form" action="/auth/login" method="post">
          <h1>Account Login</h1>
          <p class="subtitle">
            If you are already a member you can login with your email address
            and password.
          </p>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>


          <button type="submit" class="btn-primary">Login</button>

          <p class="signup">
            Don't have an account?
            <a href="./Signup.html">Sign up here</a>
          </p>
          <p role="status" class="status"></p>
        </form>
      </div>
    </main>
    <script src="./js/auth.js" defer></script>
  </body>
</html>
